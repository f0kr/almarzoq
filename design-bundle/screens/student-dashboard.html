<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atelier — My Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--cream:#fcfaf7;--ink:#272727;--grey:#4a4a4c;--clay:#9c6349;--sage:#839c49;--sage-pale:#f2f5ea;--beige:#ede8e4;--paper:#faf5f0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,sans-serif;padding:34px}
  .wrap{max-width:920px;margin:0 auto}
  h1{font-family:"Playfair Display",serif;font-weight:600;font-size:28px;margin:0 0 20px}
  .info{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
  .ic{background:#fff;border:1px solid var(--beige);border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px}
  .badge{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .badge.clay{background:#f4ece6;color:var(--clay)}
  .badge.sage{background:var(--sage-pale);color:var(--sage)}
  .ic .l{font-size:13px;color:var(--grey)}
  .ic .n{font-family:"Playfair Display",serif;font-weight:600;font-size:22px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{background:#fff;border:1px solid var(--beige);border-radius:16px;padding:10px}
  .thumb{aspect-ratio:16/9;border-radius:11px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}
  .master{font-size:11.5px;color:var(--grey);margin:9px 2px 3px}
  .ct{font-family:"Playfair Display",serif;font-weight:600;font-size:16px;margin:0 2px 10px}
  .bar{height:7px;border-radius:999px;background:var(--beige);overflow:hidden;margin:0 2px}.fill{height:100%;background:var(--clay)}.fill.done{background:var(--sage)}
  .pm{font-size:11.5px;color:var(--grey);margin:7px 2px 4px}.pm.done{color:var(--sage);font-weight:600}
</style></head>
<body><div class="wrap">
  <h1>My Learning</h1>
  <div class="info">
    <div class="ic"><span class="badge clay">&#9201;</span><div><div class="l">In progress</div><div class="n">2 courses</div></div></div>
    <div class="ic"><span class="badge sage">&#10003;</span><div><div class="l">Completed</div><div class="n">1 course</div></div></div>
  </div>
  <div class="grid">
    <div class="card"><div class="thumb"><img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=500&q=80"/></div><div class="master">Layla Hassan</div><h3 class="ct">Portrait Drawing</h3><div class="bar"><div class="fill" style="width:45%"></div></div><div class="pm">45% complete</div></div>
    <div class="card"><div class="thumb"><img src="https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=500&q=80"/></div><div class="master">Mona Adel</div><h3 class="ct">Watercolor Landscapes</h3><div class="bar"><div class="fill" style="width:20%"></div></div><div class="pm">20% complete</div></div>
    <div class="card"><div class="thumb"><img src="https://images.unsplash.com/photo-1607457561901-e6ec3a6d16cf?w=500&q=80"/></div><div class="master">Yusuf Karim</div><h3 class="ct">Pen &amp; Ink Mastery</h3><div class="bar"><div class="fill done" style="width:100%"></div></div><div class="pm done">&#10003; Completed</div></div>
  </div>
</div></body></html>
