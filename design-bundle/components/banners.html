<!-- @dsCard group="Components" title="Banners" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atelier — Banners</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--cream:#fcfaf7;--ink:#272727;--grey:#4a4a4c;--clay:#9c6349;--sage:#839c49;--sage-pale:#f2f5ea;--beige:#ede8e4;--paper:#faf5f0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,sans-serif;padding:48px}
  h1{font-family:"Playfair Display",serif;font-weight:500;font-size:24px;margin:0 0 24px}
  .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);margin:22px 0 10px}
  .banner{display:flex;align-items:center;gap:10px;border-radius:12px;padding:13px 18px;font-size:14px;font-weight:600;border:1px solid transparent}
  .success{background:var(--sage);color:var(--sage-pale);border-color:var(--sage)}
  .warning{background:var(--clay);color:#f6efe9;border-color:var(--clay)}
  .info{background:var(--ink);color:var(--paper);border-color:var(--ink)}
</style>
</head>
<body>
  <h1>Banners</h1>
  <p class="label">Success</p>
  <div class="banner success">&#10003; You've already completed this chapter</div>
  <p class="label">Warning / locked</p>
  <div class="banner warning">&#9888; You need to enroll to watch this chapter</div>
  <p class="label">Info</p>
  <div class="banner info">&#9432; This course is unpublished. It won't be visible to students.</div>
</body>
</html>
