<!-- @dsCard group="Components" title="Hero section" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atelier — Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--cream:#fcfaf7;--ink:#272727;--grey:#4a4a4c;--clay:#9c6349;--tan:#b47a5f;--sage:#839c49;--beige:#ede8e4;--paper:#faf5f0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,sans-serif}
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:56px 60px;max-width:1040px;margin:0 auto}
  .eyebrow{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--clay);background:#f4ece6;padding:6px 14px;border-radius:999px;margin-bottom:20px}
  h1{font-family:"Playfair Display",serif;font-weight:600;font-size:52px;line-height:1.05;margin:0 0 18px}
  h1 em{font-style:italic;color:var(--clay)}
  .lede{font-size:17px;color:var(--grey);line-height:1.5;max-width:440px;margin:0 0 28px}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .btn{font-family:Inter;font-weight:600;font-size:15px;border:none;cursor:pointer;border-radius:999px;padding:14px 28px;display:inline-flex;align-items:center;gap:9px}
  .primary{background:var(--clay);color:#fff}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
  .stats{display:flex;gap:32px;margin-top:36px}
  .stat .n{font-family:"Playfair Display",serif;font-weight:600;font-size:28px}
  .stat .l{font-size:12px;color:var(--grey)}
  /* art collage */
  .art{position:relative;height:420px}
  .art img{position:absolute;border-radius:18px;object-fit:cover;box-shadow:0 18px 40px rgba(39,39,39,.14)}
  .a1{width:62%;height:78%;top:0;right:0}
  .a2{width:50%;height:52%;bottom:0;left:0;border:5px solid var(--cream)}
  .tagcard{position:absolute;bottom:24px;right:-6px;background:#fff;border:1px solid var(--beige);border-radius:14px;padding:12px 16px;box-shadow:0 12px 28px rgba(39,39,39,.12)}
  .tagcard .t{font-weight:600;font-size:13px}
  .tagcard .s{font-size:11px;color:var(--sage);font-weight:600}
</style>
</head>
<body>
  <section class="hero">
    <div>
      <span class="eyebrow">Almrzoq Academy</span>
      <h1>Master the <em>Art</em> of Drawing, with real <em>masters</em>.</h1>
      <p class="lede">Structured courses in drawing, painting and digital art — taught by working professionals. Learn at your pace, build a portfolio you are proud of.</p>
      <div class="row">
        <button class="btn primary">Find Your Course &rarr;</button>
        <button class="btn ghost">Meet the masters</button>
      </div>
      <div class="stats">
        <div class="stat"><div class="n">120+</div><div class="l">Courses</div></div>
        <div class="stat"><div class="n">30</div><div class="l">Masters</div></div>
        <div class="stat"><div class="n">8k</div><div class="l">Students</div></div>
      </div>
    </div>
    <div class="art">
      <img class="a1" src="https://images.unsplash.com/photo-1499781350541-7783f6c6a0c8?w=700&q=80" alt="" />
      <img class="a2" src="https://images.unsplash.com/photo-1502691876148-a84978e59af8?w=600&q=80" alt="" />
      <div class="tagcard"><div class="t">Portrait Drawing</div><div class="s">Now enrolling</div></div>
    </div>
  </section>
</body>
</html>
