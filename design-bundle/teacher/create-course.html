<!-- @dsCard group="Teacher" title="Create course" -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atelier — Create Course</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--cream:#fcfaf7;--ink:#272727;--grey:#4a4a4c;--clay:#9c6349;--sage:#839c49;--beige:#ede8e4;--paper:#faf5f0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,sans-serif;min-height:600px;display:flex;align-items:center;justify-content:center;padding:40px}
  .box{max-width:520px}
  h1{font-family:"Playfair Display",serif;font-weight:600;font-size:30px;margin:0 0 8px}
  h1 em{font-style:italic;color:var(--clay)}
  .sub{font-size:14px;color:var(--grey);margin:0 0 28px;line-height:1.5}
  .lab{font-size:13px;font-weight:600;margin:0 0 7px}
  .inp{width:100%;background:#fff;border:1px solid var(--beige);border-radius:11px;padding:13px 15px;font-size:14.5px}
  .inp:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px rgba(156,99,73,.15)}
  .hint{font-size:12.5px;color:var(--grey);margin:8px 0 26px}
  .row{display:flex;gap:12px;align-items:center}
  .btn{font-weight:600;font-size:14px;border:none;border-radius:999px;padding:12px 26px;cursor:pointer}
  .ghost{background:transparent;color:var(--grey)}
  .pri{background:var(--clay);color:#fff}
</style></head>
<body><div class="box">
  <h1>Name your <em>course</em></h1>
  <p class="sub">What would you like to name your course? Don't worry — you can change this later.</p>
  <p class="lab">Course title</p>
  <input class="inp" placeholder="e.g. Portrait Drawing from Scratch" />
  <p class="hint">This is the title of your course. It will be visible to your students.</p>
  <div class="row"><button class="btn ghost">Cancel</button><button class="btn pri">Continue &rarr;</button></div>
</div></body></html>
